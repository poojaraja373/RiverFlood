<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - River Flood System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f8fb; }
      .signup-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
      .signup-container h1 { text-align: center; color: #0f4c81; margin-bottom: 30px; }
      .signup-container .form-group { margin-bottom: 20px; }
      .signup-container label { display: block; margin-bottom: 8px; color: #17324d; font-weight: bold; }
      .signup-container input { width: 100%; padding: 12px; border: 1px solid #b7c7d6; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
      .signup-container input:focus { outline: none; border-color: #0f4c81; }
      .signup-container button { width: 100%; padding: 12px; background: #0f4c81; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
      .signup-container button:hover { background: #0a3560; }
      .signup-container .error { color: #b00020; font-size: 14px; margin-bottom: 20px; text-align: center; }
      .signup-container .login-link { text-align: center; margin-top: 20px; }
      .signup-container .login-link a { color: #0f4c81; text-decoration: none; }
      .signup-container .login-link a:hover { text-decoration: underline; }
      .requirements { background: #f0f7ff; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 12px; color: #0f4c81; }
      .requirements ul { margin: 5px 0; padding-left: 20px; }
    </style>
  </head>
  <body>
    <div class="signup-container">
      <h1>Create Account</h1>
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      <div class="requirements">
        <strong>Requirements:</strong>
        <ul>
          <li>Username: min 3 characters</li>
          <li>Password: min 6 characters</li>
        </ul>
      </div>
      <form method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus minlength="3">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
        </div>
        <button type="submit">Create Account</button>
      </form>
      <p class="login-link">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
  </body>
</html>
