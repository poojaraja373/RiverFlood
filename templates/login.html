<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - River Flood System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f8fb; }
      .login-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
      .login-container h1 { text-align: center; color: #0f4c81; margin-bottom: 30px; }
      .login-container .form-group { margin-bottom: 20px; }
      .login-container label { display: block; margin-bottom: 8px; color: #17324d; font-weight: bold; }
      .login-container input { width: 100%; padding: 12px; border: 1px solid #b7c7d6; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
      .login-container input:focus { outline: none; border-color: #0f4c81; }
      .login-container button { width: 100%; padding: 12px; background: #0f4c81; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
      .login-container button:hover { background: #0a3560; }
      .login-container .error { color: #b00020; font-size: 14px; margin-bottom: 20px; text-align: center; }
      .login-container .info { color: #666; font-size: 13px; margin-top: 20px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>River Flood System</h1>
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      <form method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Login</button>
      </form>
      <div class="video-demo">
        <h2>Demo Video</h2>
        <video controls preload="metadata">
          <source src="{{ url_for('static', filename='riverflood.mp4') }}" type="video/mp4">
          Your browser does not support HTML5 video. Add a <code>static/riverflood.mp4</code> file or update the source in the template.
        </video>
        <p>Watch the feature walkthrough before logging in.</p>
      </div>
      <p class="info">Demo credentials:<br>Username: <strong>operator</strong><br>Password: <strong>flood2026</strong></p>
      <p style="text-align: center; margin-top: 20px; font-size: 14px;">
        Don't have an account? <a href="{{ url_for('signup') }}" style="color: #0f4c81; text-decoration: none;">Sign up here</a>
      </p>
    </div>
  </body>
</html>
